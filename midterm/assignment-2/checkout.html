<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Allbirds Clone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <header>
        <div class="bg-dark text-white text-center py-2">Free shipping on orders over $100</div>
        <nav class="navbar bg-light">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">Allbirds</a>
                <div class="d-flex gap-3">
                    <a href="checkout.html"><i class="bi bi-bag"></i></a>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="checkout-section">
            <div class="container">
                <h1 class="fs-2 mb-4">Checkout</h1>

                <form action="#">
                    <div class="checkout-fieldsets">

                        <fieldset>
                            <legend>Contact</legend>

                            <div class="field">
                                <label for="fullname">Full name</label>
                                <input class="form-control" type="text" id="fullname" name="fullname" placeholder="Saad Ahmed" required>
                                <span class="msg">Please enter your full name.</span>
                            </div>

                            <div class="field">
                                <label for="email">Email</label>
                                <input class="form-control" type="email" id="email" name="email" placeholder="you@example.com" required>
                                <span class="msg">Please enter a valid email address.</span>
                            </div>

                            <div class="field">
                                <label for="phone">Phone</label>
                                <input class="form-control" type="tel" id="phone" name="phone" placeholder="03XX-XXXXXXX" pattern="03[0-9]{2}-[0-9]{7}" required>
                                <span class="msg">Use the format 03XX-XXXXXXX.</span>
                            </div>
                        </fieldset>

                        <fieldset>
                            <legend>Delivery</legend>

                            <div class="field">
                                <label for="address">Address</label>
                                <input class="form-control" type="text" id="address" name="address" placeholder="House, street, area" required>
                                <span class="msg">Please enter your address.</span>
                            </div>

                            <div class="field">
                                <label for="city">City</label>
                                <select class="form-select" id="city" name="city" required>
                                    <option value="">Select a city</option>
                                    <option>Lahore</option>
                                    <option>Karachi</option>
                                    <option>Islamabad</option>
                                    <option>Faisalabad</option>
                                </select>
                                <span class="msg">Please choose a city.</span>
                            </div>

                            <div class="field">
                                <label for="date">Delivery date</label>
                                <input class="form-control" type="date" id="date" name="date" min="2026-10-29" max="2026-11-15" required>
                                <span class="msg">Pick a date between 29 Oct and 15 Nov 2026.</span>
                            </div>
                        </fieldset>

                    </div>

                    <button class="btn btn-dark rounded-pill w-100" type="submit">Place Order</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
